<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONIX and Thema Browser</title>
  </head>
  <body>
    <main class="page-shell">
      <header>
        <p class="eyebrow">ONIX for Books</p>
        <h1>Code browser</h1>
        <p class="intro">
          Browse ONIX for Books codelists and Thema v1.6 codes exposed by
          <code>onix-codelists</code>.
        </p>
      </header>

      <section class="controls" aria-label="Codelist controls">
        <label>
          Dataset
          <select id="dataset-select">
            <option value="onix">ONIX for Books codelists</option>
            <option value="thema">Thema v1.6</option>
          </select>
        </label>
        <label id="codelist-control">
          Codelist
          <select id="codelist-select"></select>
        </label>
        <label>
          Search entries
          <input
            id="entry-search"
            type="search"
            placeholder="e.g. 93 or Thema"
            autocomplete="off"
          />
        </label>
      </section>

      <section class="results" aria-live="polite">
        <div class="results-heading">
          <div>
            <h2 id="list-heading"></h2>
            <p id="entry-count"></p>
          </div>
          <p id="issue"></p>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Code</th>
                <th scope="col">Heading</th>
              </tr>
            </thead>
            <tbody id="entry-results"></tbody>
          </table>
          <p id="empty-state" hidden>No entries match this search.</p>
        </div>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
